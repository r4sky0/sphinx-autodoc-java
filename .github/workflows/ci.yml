name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Ruff, google-java-format, javac -Werror, actionlint, zizmor and file checks.
      - name: Run pre-commit hooks
        env:
          SKIP: no-commit-to-branch
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure --color always

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked pytest -q

  test-sphinx-8:
    name: Tests (Sphinx 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The oldest supported Sphinx; add_linkcode_domain is new in 8.2.
      - run: uv run --locked --with "sphinx==8.2.3" pytest -q

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build sdist, then wheel from sdist
        run: uv build
      - name: Check package metadata
        run: uv run --locked twine check --strict dist/*
      - name: Install the built wheel
        run: uv pip install --reinstall dist/*.whl
      - name: Test the installed distribution
        run: uv run --no-sync pytest -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  docs:
    name: Documentation
    needs: showcase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The feature gallery extracts the standalone fixture, so this job needs a JDK.
      - uses: ./.github/actions/setup
      # The docs link into the showcase API through its inventory.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase
          path: build/showcase/commons-lang/html
      - run: uv run --locked sphinx-build -W --keep-going -n docs docs/_build/html
      - run: uv run --locked sphinx-build -W --keep-going -n -D html_theme=classic docs docs/_build/classic
      - run: uv run --locked sphinx-build -W --keep-going -b text docs docs/_build/text
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: docs/_build/html
          if-no-files-found: error

  showcase:
    name: Showcase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Fetches the pinned Commons Lang commit, builds it in every showcase theme and
      # fails on warnings above the baseline.
      - run: uv run --locked --group showcase python showcase/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase
          path: build/showcase/commons-lang/html
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: showcase-report
          path: |
            build/showcase/commons-lang/report.json
            build/showcase/commons-lang/warnings-*.log
          if-no-files-found: ignore

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: uv sync --locked --extra test --group showcase
      - run: uv run --locked --extra test --group showcase playwright install --with-deps chromium
      - name: Build the standalone fixture site in every checked theme
        run: |
          for theme in alabaster classic furo sphinx_rtd_theme lumina; do
            output=$theme
            if [ "$theme" = alabaster ]; then output=html; fi
            uv run --locked --extra test --group showcase sphinx-build -W --keep-going -n \
              -D "html_theme=$theme" examples/standalone/docs "examples/standalone/docs/_build/$output"
          done
      - run: uv run --locked --extra test --group showcase python tests/visual_check.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-screenshots
          path: build/visual
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          java: "false"
      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements.txt
      - run: uv run --locked pip-audit --require-hashes --disable-pip -r /tmp/requirements.txt

  consumers:
    name: Maven and Gradle consumers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "9.1.0"
      - run: uv run --locked python tests/build_tools_check.py

  checks:
    name: All checks
    if: always()
    needs: [lint, test, package, docs, showcase, browser, audit, consumers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
