name: Deploy documentation

# Deploys only artifacts from same-repository runs and never checks out code, so
# workflow_run cannot run untrusted pull request content here. Pages keeps one site,
# so every deploy rebuilds it: main at the root and each open same-repository pull
# request at pr-preview/pr-<number>/.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # shortcut: previews omit the 164 MB showcase to stay under the 1 GB Pages limit,
      # so their showcase links 404; publish a slimmer showcase if previews need it.
      - name: Collect main and pull request documentation
        run: |
          set -euo pipefail
          main=$(gh run list --workflow ci.yml --branch main --event push --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$main" -n documentation -D site
          gh run download "$main" -n showcase -D site/showcase/commons-lang
          gh pr list --state open --limit 100 --json number,headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefOid)"' |
            while read -r number sha; do
              run=$(gh run list --workflow ci.yml --commit "$sha" --event pull_request \
                --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$run" ]; then
                gh run download "$run" -n documentation -D "site/pr-preview/pr-$number"
                echo "$number $sha" >> "$RUNNER_TEMP/previews"
              fi
            done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # Every preview's comment is refreshed, because a queued deploy can be superseded
      # before it comments on its own pull request.
      - name: Comment preview links
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/previews" ] || exit 0
          while read -r number sha; do
            gh pr comment "$number" --edit-last --create-if-none \
              --body "Documentation preview for $sha: ${PAGE_URL}pr-preview/pr-$number/"
          done < "$RUNNER_TEMP/previews"
