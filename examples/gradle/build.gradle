plugins { id 'java' }

repositories { mavenCentral() }
dependencies { implementation 'org.apache.commons:commons-lang3:3.21.0' }

def generatedSources = layout.buildDirectory.dir('generated/sources/java-autodoc')
sourceSets.main.java.srcDirs = ['../standalone/src', '../build-consumer/src', generatedSources]

tasks.register('generateBuildInfo', Copy) {
    from '../build-consumer/BuildInfo.java.in'
    into generatedSources.map { it.dir('demo') }
    rename 'BuildInfo.java.in', 'BuildInfo.java'
}
tasks.named('compileJava') { dependsOn 'generateBuildInfo' }

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}

tasks.register('writeJavaAutodocClasspath') {
    def destination = layout.buildDirectory.file('java-autodoc-classpath.txt')
    inputs.files(sourceSets.main.compileClasspath)
    outputs.file(destination)
    doLast {
        def file = destination.get().asFile
        file.parentFile.mkdirs()
        file.setText(sourceSets.main.compileClasspath.asPath, 'UTF-8')
    }
}
