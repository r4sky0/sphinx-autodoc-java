# Install once with `uv run --locked pre-commit install`; CI runs every hook.
# Python tools run through uv so their versions come from uv.lock.
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, manual]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      # experiments/result.txt is captured program output and keeps its bytes.
      - id: end-of-file-fixer
        exclude: ^experiments/result\.txt$
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      # CI runs on main after merges, so it skips this hook (SKIP=no-commit-to-branch).
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
        exclude: ^experiments/result\.txt$

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f # frozen: v2.16.0
    hooks:
      # google-java-format, the default formatter of Spotless's Java step. The jar is
      # pinned by SHA-256. Fixtures in examples/ and experiments/ keep their layout
      # because their Javadoc text is test input.
      - id: pretty-format-java
        files: ^src/.*\.java$
        args:
          - --autofix
          - --google-java-formatter-version=1.37.0
          - --formatter-jar-checksum=834b2a0c38cb774953322a84b5ca3f2f40dd3156650b3cd44d3b744345962f7a

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316 # frozen: v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 17e12779811926f000bdfa1795f9e3735dd71ac3 # frozen: v0.26
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049 # frozen: 0.38.2
    hooks:
      - id: check-dependabot
      - id: check-github-actions

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/crate-ci/typos
    rev: b859c0df7f391deba73030f79b957e62b4d81dc6 # frozen: varcon-core-v5.0.7
    hooks:
      - id: typos

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: javac-lint
        name: javac -Xlint:all -Werror (doclet)
        entry: javac -Xlint:all -Werror -proc:none -d build/doclet-check src/sphinx_java_autodoc/java/SphinxDoclet.java
        language: system
        files: ^src/.*\.java$
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: uv run --locked actionlint
        language: system
        files: ^\.github/
        pass_filenames: false
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
